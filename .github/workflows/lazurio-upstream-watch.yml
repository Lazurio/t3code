name: Lazurio upstream watch

# Once a day: when upstream T3 Code has a stable release newer than the base of main
# (UPSTREAM_TAG in lazurio-fork-ci.yml), opens the rebuild's tracking issue from the runbook's
# template, or comments once on the open one. It reads upstream's public releases and this
# repository's files and writes only issues here, with this repository's token. The rebuild,
# the swap of main and the releases stay with people.
# Runbook: docs/operations/lazurio-fork-release.md, "Nové stabilní vydání upstreamu".

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Upstream stable release
    if: github.repository == 'Lazurio/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Open or update the rebuild's tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          raw() { gh api "repos/$REPO/contents/$1?ref=main" -H "Accept: application/vnd.github.raw"; }

          base="$(raw .github/workflows/lazurio-fork-ci.yml | sed -n 's/^  UPSTREAM_TAG: //p')"
          latest="$(gh release list --repo pingdotgg/t3code --exclude-drafts --exclude-pre-releases \
            --limit 20 --json tagName \
            --jq 'map(.tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))[0] // ""')"
          if [[ ! "$base" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || ! "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected tags: main's UPSTREAM_TAG '$base', upstream's newest stable '$latest'." >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "$base" "$latest" | sort -V | tail -n 1)" == "$base" ]]; then
            echo "main is built on $base; upstream's newest stable release is $latest."
            exit 0
          fi

          # The tag's commit: an annotated tag advertises it as <tag>^{} beside the tag object; a
          # lightweight tag is the commit itself.
          refs="$(git ls-remote https://github.com/pingdotgg/t3code.git "refs/tags/$latest" "refs/tags/$latest^{}")"
          sha="$(awk -v ref="refs/tags/$latest^{}" '$2 == ref { print $1 }' <<<"$refs")"
          if [[ -z "$sha" ]]; then
            sha="$(awk -v ref="refs/tags/$latest" '$2 == ref { print $1 }' <<<"$refs")"
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Upstream's tag $latest does not resolve to exactly one commit ('$sha')." >&2
            exit 1
          fi
          marker="<!-- lazurio-upstream-watch $latest -->"
          note="$marker
          Upstream T3 Code vydal stabilní vydání [$latest](https://github.com/pingdotgg/t3code/releases/tag/$latest) (commit \`$sha\`). \`main\` stojí na $base. Postup: [Nové stabilní vydání upstreamu](https://github.com/$REPO/blob/main/docs/operations/lazurio-fork-release.md#nové-stabilní-vydání-upstreamu)."

          # One tracking issue at a time: a newer stable during a rebuild is noted in the open one.
          issue="$(gh issue list --repo "$REPO" --state open --limit 500 --json number,title \
            --jq 'map(select(.title | startswith("Přestavba na upstream T3 Code ")))[0].number // ""')"
          if [[ -z "$issue" ]]; then
            template="$(raw docs/operations/lazurio-fork-release.md |
              sed -n '/^<!-- rebuild-issue:start -->$/,/^<!-- rebuild-issue:end -->$/p')"
            test -n "$template"
            gh issue create --repo "$REPO" --title "Přestavba na upstream T3 Code $latest" \
              --body "$note"$'\n\n'"$template"
          elif [[ "$(gh issue view "$issue" --repo "$REPO" --json body,comments \
            --jq '[.body, .comments[].body] | join("\n")')" != *"$marker"* ]]; then
            gh issue comment "$issue" --repo "$REPO" --body "$note"
          else
            echo "Issue #$issue already notes $latest."
          fi
