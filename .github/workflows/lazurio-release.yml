name: Lazurio T3 Code Release

# Manually dispatched from main by the release owner. Builds and tests the CLI
# archives, then waits for approval in the lazurio-t3code-release environment
# before it tags the source, publishes the GitHub Release that Lazurio Machines
# update from, and pushes the matching OCI image. Nothing is ever overwritten.
# Runbook: docs/operations/lazurio-fork-release.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version X.Y.Z-lazurio.N (tag vX.Y.Z-lazurio.N)
        required: true
        type: string
      source_sha:
        description: Exact 40-character commit at the tip of main
        required: true
        type: string
      upstream_tag:
        description: Exact upstream stable tag the source is based on (vX.Y.Z)
        required: true
        type: string
      upstream_sha:
        description: Exact 40-character upstream tag commit
        required: true
        type: string

permissions:
  contents: read
  id-token: none

concurrency:
  group: lazurio-t3code-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lazurio/t3code
  VERSION: ${{ inputs.version }}
  RELEASE_TAG: v${{ inputs.version }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  UPSTREAM_TAG: ${{ inputs.upstream_tag }}
  UPSTREAM_SHA: ${{ inputs.upstream_sha }}

jobs:
  verify:
    name: Verify source and version
    if: github.repository == 'Lazurio/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch and verify the exact release source
        shell: bash
        run: |
          set -euo pipefail

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-lazurio\.[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$UPSTREAM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$VERSION" == "${UPSTREAM_TAG#v}-lazurio."* ]]
          test "$GITHUB_REF" = "refs/heads/main"

          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --filter=blob:none --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"

          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --filter=blob:none upstream \
            "refs/tags/$UPSTREAM_TAG:refs/tags/upstream-$UPSTREAM_TAG"
          test "$(git rev-parse "refs/tags/upstream-$UPSTREAM_TAG^{commit}")" = "$UPSTREAM_SHA"
          test "$(git merge-base "$UPSTREAM_SHA" "$SOURCE_SHA")" = "$UPSTREAM_SHA"
          test "$(git rev-list --merges "$UPSTREAM_SHA..$SOURCE_SHA" --count)" = 0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.13.1

      # Servers take the newest non-draft release in the index as the one to
      # update to, so a release must be the highest version on the channel.
      - name: Refuse an existing or non-increasing version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git ls-remote origin "refs/tags/$RELEASE_TAG")" ]]; then
            echo "Tag $RELEASE_TAG already exists." >&2
            exit 1
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          node --input-type=module - "$RUNNER_TEMP/releases.json" <<'JS'
          import * as NodeFS from "node:fs";
          import { compareExactServiceVersions } from "./apps/server/src/cloud/serviceProtocol.ts";

          const version = process.env.VERSION;
          const releases = JSON.parse(NodeFS.readFileSync(process.argv[2], "utf8")).flat();
          if (releases.some((release) => release.tag_name === `v${version}`)) {
            throw new Error(`A GitHub Release for v${version} already exists.`);
          }
          for (const release of releases) {
            if (release.draft) continue;
            const published = /^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$/.exec(release.tag_name)?.[1];
            if (published !== undefined && compareExactServiceVersions(version, published) <= 0) {
              throw new Error(`${version} is not newer than the published ${published}.`);
            }
          }
          console.log(`${version} is the highest version on the channel.`);
          JS

  archives:
    name: CLI archives
    needs: verify
    uses: ./.github/workflows/lazurio-cli-archives.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}

  publish:
    name: Publish release and image
    needs: [verify, archives]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: lazurio-t3code-release
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      RELEASE_CONTROL: ${{ vars.LAZURIO_T3CODE_RELEASE_CONTROL }}
    steps:
      # Runs after approval and before any side effect. main may have moved
      # while the run waited; then this release is stale and stops here.
      - id: source
        name: Recheck the release source after approval
        shell: bash
        env:
          TAG_KEY_PRESENT: ${{ secrets.LAZURIO_RELEASE_TAG_KEY != '' }}
        run: |
          set -euo pipefail
          test "$RELEASE_CONTROL" = "reviewed-v1"
          if [[ "$TAG_KEY_PRESENT" != "true" ]]; then
            echo "Environment secret LAZURIO_RELEASE_TAG_KEY is missing; nothing was published." >&2
            exit 1
          fi

          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --filter=blob:none --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main"
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$SOURCE_SHA" ]]; then
            echo "main moved away from $SOURCE_SHA since dispatch; nothing was published." >&2
            exit 1
          fi
          git checkout --detach "$SOURCE_SHA"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --filter=blob:none upstream \
            "refs/tags/$UPSTREAM_TAG:refs/tags/upstream-$UPSTREAM_TAG"
          test "$(git rev-parse "refs/tags/upstream-$UPSTREAM_TAG^{commit}")" = "$UPSTREAM_SHA"

          source_date_epoch="$(git show -s --format=%ct HEAD)"
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "source_date_iso=$(date -u -d "@$source_date_epoch" +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Download CLI archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # Installers verify archives against this file, so it is written from the
      # exact bytes that get uploaded, in upstream's sha256sum format.
      - name: Write CLI archive checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test "$(ls)" = "$(printf '%s\n' "t3-$VERSION-darwin-arm64.tar.gz" "t3-$VERSION-linux-x64.tar.gz")"
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # One attestation per archive: attestation-url is only set for a
      # single subject, and each archive gets its own link in the evidence.
      - id: attest_linux
        name: Attest the linux-x64 archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/t3-${{ inputs.version }}-linux-x64.tar.gz

      - id: attest_darwin
        name: Attest the darwin-arm64 archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/t3-${{ inputs.version }}-darwin-arm64.tar.gz

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package_versions="$(mktemp)"
          if ! gh api --paginate --slurp \
            "orgs/Lazurio/packages/container/t3code/versions?per_page=100" > "$package_versions"
          then
            echo "Unable to enumerate GHCR package versions." >&2
            exit 1
          fi
          tag_query_status=0
          jq -e --arg tag "$VERSION" \
            '[.[][] | .metadata.container.tags[]?] | index($tag) != null' \
            "$package_versions" >/dev/null || tag_query_status=$?
          if (( tag_query_status == 0 )); then
            echo "OCI tag $IMAGE:$VERSION already exists and will not be overwritten." >&2
            exit 1
          fi
          if (( tag_query_status != 1 )); then
            echo "Unable to evaluate GHCR package version metadata." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: build
        name: Build and publish the immutable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.lazurio
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          provenance: mode=max
          sbom: true
          build-args: |
            NODE_BASE_IMAGE=node:24.19.0-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
            PACKAGE_VERSION=${{ env.VERSION }}
            PNPM_VERSION=11.10.0
            RELEASE_TAG=${{ env.RELEASE_TAG }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.source_date_epoch }}
            SOURCE_REVISION=${{ env.SOURCE_SHA }}
            UPSTREAM_BASE=${{ env.UPSTREAM_SHA }}
          labels: |
            org.opencontainers.image.created=${{ steps.source.outputs.source_date_iso }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=https://github.com/Lazurio/t3code
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Verify the published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$IMAGE_DIGEST"
          docker image inspect "$IMAGE@$IMAGE_DIGEST" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | \
            grep -Fx 'T3CODE_CLIENT_SESSION_TTL=365d'
          docker run --rm --network none "$IMAGE@$IMAGE_DIGEST" --version | \
            grep -Fx "t3 v$VERSION"

      - id: attest_image
        name: Attest the published OCI digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Assemble release notes and evidence
        env:
          LINUX_ATTESTATION: ${{ steps.attest_linux.outputs.attestation-url }}
          DARWIN_ATTESTATION: ${{ steps.attest_darwin.outputs.attestation-url }}
          IMAGE_ATTESTATION: ${{ steps.attest_image.outputs.attestation-url }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --sort-keys \
            --arg repository "https://github.com/$GITHUB_REPOSITORY" \
            --arg source "$SOURCE_SHA" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$VERSION" \
            --arg upstream_tag "$UPSTREAM_TAG" \
            --arg upstream_sha "$UPSTREAM_SHA" \
            --arg image "$IMAGE" \
            --arg digest "$IMAGE_DIGEST" \
            --arg linux_attestation "$LINUX_ATTESTATION" \
            --arg darwin_attestation "$DARWIN_ATTESTATION" \
            --arg image_attestation "$IMAGE_ATTESTATION" \
            --arg run "$RUN_URL" \
            --rawfile checksums release-assets/SHA256SUMS \
            '{
              schema_version: "t3code.fork-release.v3",
              source: {
                repository: $repository,
                commit: $source,
                tag: $tag,
                version: $version,
                upstream_repository: "https://github.com/pingdotgg/t3code",
                upstream_release: $upstream_tag,
                upstream_base: $upstream_sha
              },
              artifact: {
                archives: ($checksums | split("\n") | map(select(length > 0) | split("  ") | {name: .[1], sha256: .[0]})),
                checksums: "SHA256SUMS",
                image: $image,
                digest: $digest
              },
              configuration: {
                base_path: "/",
                client_session_ttl: "365d",
                external_origin: "runtime T3CODE_EXTERNAL_ORIGIN",
                environment_label: "runtime T3CODE_ENVIRONMENT_LABEL"
              },
              validation: {
                workflow_run: $run,
                archive_attestations: {
                  "linux-x64": $linux_attestation,
                  "darwin-arm64": $darwin_attestation
                },
                image_attestation: $image_attestation
              }
            }' > release-assets/release-evidence.json

          {
            echo "Vanilla upstream T3 Code $UPSTREAM_TAG plus the Lazurio overlay, served at the"
            echo "root of its own hostname. Lazurio Machines update to it from this release."
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- Upstream base: \`$UPSTREAM_TAG\` at \`$UPSTREAM_SHA\`"
            echo "- OCI image: \`$IMAGE:$VERSION\` = \`$IMAGE@$IMAGE_DIGEST\`"
            echo "- linux-x64 archive attestation: $LINUX_ATTESTATION"
            echo "- darwin-arm64 archive attestation: $DARWIN_ATTESTATION"
            echo "- Image attestation: $IMAGE_ATTESTATION"
            echo
            echo "## Lazurio overlay"
            echo
            git log --no-merges --pretty='format:- %s (%h)' "$UPSTREAM_SHA..$SOURCE_SHA"
            echo
          } > "$RUNNER_TEMP/RELEASE_NOTES.md"

      # Release tags can only be created through the deploy key whose private
      # half is a secret of this environment, so only an approved run can tag.
      # A plain push never replaces an existing tag: one that appeared since
      # verification stops the release here.
      - name: Tag the exact source with the release deploy key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_KEY: ${{ secrets.LAZURIO_RELEASE_TAG_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAG_KEY" ]]; then
            echo "Environment secret LAZURIO_RELEASE_TAG_KEY is missing." >&2
            exit 1
          fi
          if [[ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$SOURCE_SHA" ]]; then
            echo "main moved away from $SOURCE_SHA; the release is not tagged." >&2
            exit 1
          fi

          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$TAG_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          git -c core.sshCommand="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts" \
            push "git@github.com:$GITHUB_REPOSITORY.git" "$SOURCE_SHA:refs/tags/$RELEASE_TAG"

          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "T3 Code $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" \
            --latest \
            "release-assets/t3-$VERSION-darwin-arm64.tar.gz" \
            "release-assets/t3-$VERSION-linux-x64.tar.gz" \
            release-assets/SHA256SUMS \
            release-assets/release-evidence.json
