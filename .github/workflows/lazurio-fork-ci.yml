name: Lazurio Fork CI

# Read-only CI for the Lazurio overlay on upstream T3 Code. Upstream workflows
# need Blacksmith runners and upstream secrets and are disabled in this
# repository's Actions settings; see docs/operations/lazurio-fork-release.md.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: none

concurrency:
  group: lazurio-fork-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM_TAG: v0.0.45
  UPSTREAM_SHA: 6c8fed35dded9ff71c5b46807125457acbb76be6

jobs:
  server-and-web:
    name: Server and web compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch exact source and upstream base without credentials
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          git init .
          git remote add source "https://github.com/${SOURCE_REPOSITORY}.git"
          git fetch --filter=blob:none source "$SOURCE_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"

          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --filter=blob:none upstream \
            "refs/tags/$UPSTREAM_TAG:refs/tags/upstream-$UPSTREAM_TAG"
          test "$(git rev-parse "refs/tags/upstream-$UPSTREAM_TAG^{commit}")" = "$UPSTREAM_SHA"
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          test "$(git rev-list --merges "$UPSTREAM_SHA..HEAD" --count)" = 0

          # The overlay is server configuration plus Lazurio release files.
          # Clients, shared packages and wire contracts stay upstream, except
          # the exact files below. Each one is a reviewed decision; every other
          # path under those roots fails.
          allowed_upstream_changes=(
            # Managed Folder entry uses the shared native project and settings paths.
            apps/web/src/hooks/useScratchProject.ts
            apps/web/src/components/sidebar/SidebarThreadHeader.tsx
            apps/web/src/components/Sidebar.tsx
            apps/web/src/components/chat/DraftHeroHeadline.tsx
            # Managed Lazurio Folder: server-owned start context and model recommendation.
            apps/web/src/components/CommandPalette.tsx
            apps/web/src/components/GitActionsControl.tsx
            apps/web/src/components/onboarding/FirstRunGate.tsx
            apps/web/src/hooks/useHandleNewThread.ts
            apps/web/src/hooks/useHandleNewThread.test.ts
            apps/web/src/routes/welcome.tsx
            apps/web/src/lazurio/ManagedFolderWelcome.tsx
            apps/web/src/lazurio/managedFolder.ts
            apps/web/src/lazurio/managedFolder.test.ts
            packages/contracts/src/server.ts
            packages/contracts/src/settings.ts
            packages/shared/src/serverSettings.ts
            # In-app update from the configured release channel; proposed upstream.
            apps/web/src/components/ChatView.tsx
            apps/web/src/components/chat/useAutoBalanceUpdateBanner.tsx
            apps/web/src/components/settings/ConnectionsSettings.tsx
            apps/web/src/versionSkew.test.ts
            apps/web/src/versionSkew.ts
            # Optional availableServerUpdate descriptor field; proposed upstream.
            packages/contracts/src/environment.ts
            # Configurable release repository and semver release index; proposed upstream.
            packages/shared/src/cliRelease.test.ts
            packages/shared/src/cliRelease.ts
            # Prepared prompt from the Lazurio shell by link (Lazurio/t3code#35): the link is
            # taken off the address at boot and the chat layout opens it as an unsent draft.
            apps/web/src/lazurio/LazurioPromptDraft.tsx
            apps/web/src/lazurio/promptDraft.test.ts
            apps/web/src/lazurio/promptDraft.ts
            apps/web/src/main.tsx
            apps/web/src/routes/_chat.tsx
            # The Lazurio shell slot (issue #33): the loader, the rail, the padding and
            # Buddy in index.html, and the column head at the top of the sidebar. The
            # shell itself is served by the Environment's Launchpad; without it nothing renders.
            # index.html also maps T3's sidebar tokens to the shell's colour roles.
            apps/web/index.html
            apps/web/src/components/AppSidebarLayout.tsx
            # The Environment browser (root decision 0191, plan DEV-6646): the web client has no
            # browser, so on a Lazurio Environment the right panel shows the thread's tabs of the
            # Environment browser, each the view of one remote tab in a frame. The server keeps a
            # thread's tabs and streams them; every device reconciles its strip to that list, and
            # a tab a page opens, a link in the chat or Vrátit holds a tab. A surface kind of its
            # own with its title, icon and tooltip in RightPanelTabs.tsx, one generic store action,
            # and ChatView.tsx's one hook call and the wrapper that keeps each tab's frame beside
            # the surface in view (listed above).
            apps/web/src/components/RightPanelTabs.tsx
            apps/web/src/lazurio/LazurioEnvironmentBrowser.test.tsx
            apps/web/src/lazurio/LazurioEnvironmentBrowser.tsx
            apps/web/src/lazurio/environmentBrowser.test.ts
            apps/web/src/lazurio/environmentBrowser.ts
            apps/web/src/lazurio/threadTabs.test.ts
            apps/web/src/lazurio/threadTabs.ts
            apps/web/src/rightPanelStore.ts
            # Another Lazurio Environment's view opens as a marked tab of the right panel (plan
            # DEV-6646). The parser of a view's address is a copy of the server's, whose Environment
            # browser host answers preview_open of such a view.
            apps/web/src/lazurio/browserView.ts
            # A thread's tabs from the server and Nová karta behind "+" (LazurioPlatform F47 step 4,
            # task 501): where the Environment's shell defines <lazurio-new-tab>, "+" and the empty
            # panel open Nová karta with upstream's own "+" actions as its tools. The seams are one
            # hook call and two conditionals in RightPanelTabs.tsx (listed above).
            apps/web/src/lazurio/LazurioNewTab.test.tsx
            apps/web/src/lazurio/LazurioNewTab.tsx
            # Upstream 410793042 (#17730), backported: the right panel's tabs reorder by dragging.
            # It goes at the 0.0.46 refresh, where upstream owns it. Its seams in ChatView.tsx,
            # RightPanelTabs.tsx and rightPanelStore.ts are listed above.
            apps/web/src/rightPanelStore.test.ts
            apps/web/src/routes/_chat.pull-requests.tsx
          )
          unexpected="$(git diff --name-only "$UPSTREAM_SHA..HEAD" |
            grep -E '^(apps/(web|mobile|desktop)|packages)/' |
            grep -vxF -f <(printf '%s\n' "${allowed_upstream_changes[@]}") || true)"
          if [ -n "$unexpected" ]; then
            echo "Fork overlay changed an upstream client or shared package:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec vp fmt --check

      - name: Typecheck server and web
        run: |
          pnpm exec vp run --filter t3 typecheck
          pnpm exec vp run --filter @t3tools/web typecheck

      # The tests come from the diff against the exact upstream base, so a new
      # seam is tested without editing this step: every test file the overlay
      # adds or changes, and upstream's own test beside every file it changes
      # (X.ts → X.test.ts). Plus the fixed gate below, whatever the diff says.
      # Each package runs its files with its own test script.
      - name: Test what the overlay changes
        run: |
          set -euo pipefail
          # The fixed gate: every test under these paths runs. It keeps what fork CI
          # always ran: the directories whose tests import overlay seams without
          # being changed (src/auth: the external origin, the session TTL and the
          # server config), both overlay folders, and the tests of the hosted
          # configuration and the managed Folder. A path that is gone or holds no
          # tests fails the step, so a rebuild reviews the gate.
          gate=(
            apps/server/src/auth
            apps/server/src/cli/config.test.ts
            apps/server/src/environment/ServerEnvironmentLabel.test.ts
            apps/server/src/lazurio
            apps/server/src/orchestration/Layers/OrchestrationEngine.test.ts
            apps/server/src/server.test.ts
            apps/server/src/serverSettings.test.ts
            apps/server/src/vcs/VcsProvisioningService.test.ts
            apps/web/src/lazurio
          )
          tests="$RUNNER_TEMP/overlay-tests.tsv"
          {
            git diff --name-only --diff-filter=d "$UPSTREAM_SHA..HEAD" -- '*.ts' '*.tsx' |
              while IFS= read -r file; do
                case "$file" in
                  *.test.ts | *.test.tsx) echo "$file" ;;
                  *)
                    for test in "${file%.*}.test.ts" "${file%.*}.test.tsx"; do
                      if [ -f "$test" ]; then echo "$test"; fi
                    done
                    ;;
                esac
              done
            for path in "${gate[@]}"; do
              gated="$(git ls-files -- "$path" | grep -E '\.test\.tsx?$' || true)"
              if [ -z "$gated" ]; then
                echo "The test gate's $path is gone or holds no tests." >&2
                exit 1
              fi
              echo "$gated"
            done
          } | sort -u |
            while IFS= read -r test; do
              package="$(dirname "$test")"
              until [ -f "$package/package.json" ]; do package="$(dirname "$package")"; done
              printf '%s\t%s\n' "$package" "${test#"$package"/}"
            done > "$tests"
          status=0
          for package in $(cut -f1 "$tests" | sort -u); do
            files=()
            while IFS=$'\t' read -r owner test; do
              if [ "$owner" = "$package" ]; then files+=("$test"); fi
            done < "$tests"
            echo "::group::$package: ${#files[@]} test files"
            (cd "$package" && pnpm run test "${files[@]}") || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Validate Lazurio release contract
        run: node --test scripts/lazurio-release-contract.test.mjs

      - name: Build the release image without publishing
        run: |
          set -euo pipefail
          docker build \
            --file Dockerfile.lazurio \
            --build-arg NODE_BASE_IMAGE=node:24.19.0-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584 \
            --build-arg PACKAGE_VERSION="${UPSTREAM_TAG#v}-lazurio.0" \
            --build-arg PNPM_VERSION=11.10.0 \
            --build-arg RELEASE_TAG=ci \
            --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            --build-arg SOURCE_REVISION="$(git rev-parse HEAD)" \
            --build-arg UPSTREAM_BASE="$UPSTREAM_SHA" \
            --tag lazurio/t3code:ci \
            .
          docker run --rm --network none lazurio/t3code:ci --version | grep -Fx "t3 ${UPSTREAM_TAG}-lazurio.0"
          docker image inspect lazurio/t3code:ci \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | \
            grep -Fx 'T3CODE_CLIENT_SESSION_TTL=365d'

  # The same archive build and launcher install the release runs, under the
  # never-released version <upstream>-lazurio.0. Keep it in step with UPSTREAM_TAG.
  cli-archives:
    name: CLI archives
    uses: ./.github/workflows/lazurio-cli-archives.yml
    with:
      version: 0.0.45-lazurio.0
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      source_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
