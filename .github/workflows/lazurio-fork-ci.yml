name: Lazurio Fork CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read
  id-token: none

concurrency:
  group: lazurio-fork-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-and-web:
    name: Server and web compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact public revision without credentials
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --filter=blob:none origin "$SOURCE_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"

          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --filter=blob:none upstream \
            refs/tags/v0.0.35:refs/tags/upstream-v0.0.35
          test "$(git rev-parse refs/tags/upstream-v0.0.35^{commit})" = \
            f925d639421844f02b3166d29281905dbba6d529
          git merge-base --is-ancestor refs/tags/upstream-v0.0.35 HEAD

          changed_files="$(mktemp)"
          git diff --name-only refs/tags/upstream-v0.0.35..HEAD > "$changed_files"
          if grep -Eq '^apps/(mobile|desktop)(/|$)' "$changed_files"; then
            echo "Fork overlay changed an official vanilla client." >&2
            exit 1
          fi
          if grep -E '^(packages/contracts|packages/client-runtime)(/|$)' "$changed_files" | \
            grep -Ev '^packages/contracts/src/(assets|environment|orchestration|provider)(\.test)?\.ts$|^packages/contracts/src/vanilla-v0\.0\.35-compat\.test\.ts$|^packages/client-runtime/src/state/threadReducer(\.test)?\.ts$' | \
            grep -q .; then
            echo "Fork overlay exceeded the reviewed generic-file compatibility surface." >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec vp fmt --check

      - name: Lint
        run: pnpm exec vp lint --report-unused-disable-directives

      - name: Typecheck generic-file compatibility surface
        run: |
          pnpm exec vp run --filter @t3tools/contracts typecheck
          pnpm exec vp run --filter @t3tools/client-runtime typecheck
          pnpm exec vp run --filter t3 typecheck
          pnpm exec vp run --filter @t3tools/web typecheck

      - name: Test hosted-origin and access compatibility
        run: |
          cd apps/server
          # The router seam owns process-global HTTP fixtures. Keep it in its
          # own Vitest process so sibling auth suites cannot answer its ports.
          pnpm exec vp test run src/server.test.ts
          pnpm exec vp test run \
            src/cli/config.test.ts \
            src/cli/pair.test.ts \
            src/serverRuntimeState.test.ts \
            src/auth/EnvironmentAuth.test.ts \
            src/auth/EnvironmentAuthPolicy.test.ts \
            src/auth/PairingGrantStore.test.ts \
            src/auth/SessionStore.test.ts \
            src/auth/utils.test.ts
          cd ../web
          pnpm exec vp test run src/components/settings/ConnectionsSettings.logic.test.ts

      - name: Test generic file collaboration and pinned vanilla decoding
        run: |
          cd packages/contracts
          pnpm exec vp test run \
            src/assets.test.ts \
            src/environment.test.ts \
            src/orchestration.test.ts \
            src/provider.test.ts \
            src/vanilla-v0.0.35-compat.test.ts
          cd ../client-runtime
          pnpm exec vp test run src/state/threadReducer.test.ts
          cd ../../apps/server
          pnpm exec vp test run \
            src/assets/AssetAccess.test.ts \
            src/assets/AttachmentUpload.test.ts \
            src/assets/ContextFileAccess.test.ts \
            src/environment/ServerEnvironment.test.ts \
            src/http.test.ts \
            src/orchestration/Layers/ProjectionPipeline.test.ts \
            src/orchestration/Layers/ProjectionSnapshotQuery.test.ts \
            src/orchestration/Layers/ProviderCommandReactor.test.ts \
            src/orchestration/Normalizer.attachments.test.ts \
            src/persistence/Layers/ProjectionThreadMessages.test.ts \
            src/persistence/Migrations/044_ProjectionThreadMessagesContextFiles.test.ts \
            src/provider/Layers/ProviderService.test.ts
          cd ../web
          pnpm exec vp test run \
            src/components/ChatMarkdown.test.tsx \
            src/components/ChatView.logic.test.ts \
            src/components/chat/MessagesTimeline.test.tsx \
            src/composerDraftStore.test.ts \
            src/lib/attachmentUploadQueue.test.ts

      - name: Build vanilla web distribution
        run: pnpm exec vp run --filter @t3tools/web build

      - name: Validate Lazurio release contract
        run: |
          node --test scripts/lazurio-release-contract.test.mjs
          node --test scripts/lazurio-context-file-migration-contract.test.mjs

      - name: Build the release image without publishing
        run: |
          docker build \
            --file Dockerfile.lazurio \
            --build-arg NODE_BASE_IMAGE=node:24.19.0-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584 \
            --build-arg BUN_BASE_IMAGE=oven/bun:1.3.14@sha256:50317d83cd5a5ae1d8b35b3379c69f57ce1a0dbf4def91f0965653d767851834 \
            --build-arg BUN_VERSION=1.3.14 \
            --build-arg PACKAGE_VERSION=0.0.35 \
            --build-arg PNPM_VERSION=11.10.0 \
            --build-arg RELEASE_TAG=ci-prestable \
            --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg UPSTREAM_BASE=f925d639421844f02b3166d29281905dbba6d529 \
            --build-arg VITE_DISTRIBUTION_RELEASE=ci-prestable \
            --build-arg VITE_DISTRIBUTION_UPSTREAM_BASE=f925d639421844f02b3166d29281905dbba6d529 \
            --build-arg VITE_DISTRIBUTION_UPSTREAM_TAG=v0.0.35 \
            --build-arg "VITE_HOSTED_APP_NAME=Lazurio T3 Code" \
            --tag lazurio/t3code:ci \
            .
          docker run --rm --network none lazurio/t3code:ci --version
          docker image inspect lazurio/t3code:ci \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | \
            grep -Fx 'T3CODE_PAIRING_TOKEN_TTL=15m'
          docker image inspect lazurio/t3code:ci \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | \
            grep -Fx 'T3CODE_CLIENT_SESSION_TTL=365d'
          docker run --rm --network none --entrypoint node lazurio/t3code:ci -e '
            const pty = require("/opt/lazurio-t3/node_modules/node-pty");
            const child = pty.spawn("/bin/sh", ["-lc", "printf lazurio-pty-smoke"], {
              name: "xterm",
              cols: 80,
              rows: 24,
              cwd: "/tmp",
              env: process.env,
            });
            let output = "";
            child.onData((data) => { output += data; });
            child.onExit(({ exitCode }) => {
              if (exitCode !== 0 || output !== "lazurio-pty-smoke") {
                console.error({ exitCode, output });
                process.exit(1);
              }
              console.log("pty-smoke=PASS");
            });
          '

  windows-generic-files:
    name: Windows generic-file compatibility
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact public revision without credentials
        shell: pwsh
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --filter=blob:none origin $env:SOURCE_REF
          git checkout --detach FETCH_HEAD
          $actualRef = git rev-parse HEAD
          if ($actualRef -ne $env:SOURCE_REF) {
            throw "Expected $env:SOURCE_REF, checked out $actualRef"
          }

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.10.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck generic-file compatibility surface
        run: |
          pnpm exec vp run --filter @t3tools/contracts typecheck
          pnpm exec vp run --filter @t3tools/client-runtime typecheck
          pnpm exec vp run --filter t3 typecheck
          pnpm exec vp run --filter @t3tools/web typecheck

      - name: Test generic file collaboration and pinned vanilla decoding
        run: |
          cd packages/contracts
          pnpm exec vp test run src/assets.test.ts src/environment.test.ts src/orchestration.test.ts src/provider.test.ts src/vanilla-v0.0.35-compat.test.ts
          cd ../client-runtime
          pnpm exec vp test run src/state/threadReducer.test.ts
          cd ../../apps/server
          # Keep this Windows gate on the new exact-file surface. Upstream's
          # unrelated favicon cases currently report OS-native separators.
          pnpm exec vp test run src/assets/AssetAccess.test.ts -t "download|context-file"
          pnpm exec vp test run src/assets/AttachmentUpload.test.ts src/assets/ContextFileAccess.test.ts src/environment/ServerEnvironment.test.ts src/http.test.ts src/orchestration/Layers/ProjectionPipeline.test.ts src/orchestration/Layers/ProjectionSnapshotQuery.test.ts src/orchestration/Layers/ProviderCommandReactor.test.ts src/orchestration/Normalizer.attachments.test.ts src/persistence/Layers/ProjectionThreadMessages.test.ts src/persistence/Migrations/044_ProjectionThreadMessagesContextFiles.test.ts src/provider/Layers/ProviderService.test.ts
          cd ../web
          pnpm exec vp test run src/components/ChatMarkdown.test.tsx src/components/ChatView.logic.test.ts src/components/chat/MessagesTimeline.test.tsx src/composerDraftStore.test.ts src/lib/attachmentUploadQueue.test.ts
