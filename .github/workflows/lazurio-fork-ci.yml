name: Lazurio Fork CI

# Read-only CI for the Lazurio overlay on upstream T3 Code. Upstream workflows
# need Blacksmith runners and upstream secrets and are disabled in this
# repository's Actions settings; see docs/operations/lazurio-fork-release.md.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: none

concurrency:
  group: lazurio-fork-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM_TAG: v0.1.6
  UPSTREAM_SHA: 2359643cffa6ba9ee84d6f2694b935de54a8013e

jobs:
  server-and-web:
    name: Server and web compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch exact source and upstream base without credentials
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          git init .
          git remote add source "https://github.com/${SOURCE_REPOSITORY}.git"
          git fetch --filter=blob:none source "$SOURCE_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"

          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --filter=blob:none upstream \
            "refs/tags/$UPSTREAM_TAG:refs/tags/upstream-$UPSTREAM_TAG"
          test "$(git rev-parse "refs/tags/upstream-$UPSTREAM_TAG^{commit}")" = "$UPSTREAM_SHA"
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          test "$(git rev-list --merges "$UPSTREAM_SHA..HEAD" --count)" = 0

          # The overlay is the Lazurio release files plus seams in upstream T3 Code.
          # Under apps/, packages/ and scripts/ it changes only the files below, each
          # a reviewed decision, grouped by the feature that owns it; its own folders,
          # apps/*/src/lazurio/, which upstream does not have, pass whole. Any other
          # change there fails.
          allowed_upstream_changes=(
            # Shared seams, each with the hooks of several features below: the server's
            # CLI and runtime config (hosted settings, the managed Folder), SessionStore.ts (the
            # hosted session's TTL and cookie, and who a session acts as, signed into its token),
            # EnvironmentAuth.ts (a headless MCP client's runtime-mode ceiling, and who a session
            # is issued and authenticated as acting for), ServerEnvironment.ts
            # (the update notice's descriptor field, and no serverBrowser or triage capability on
            # a Lazurio Environment), CodexAdapterV2.ts and its test (a Codex thread's agent-browser
            # session in its config, and the question tool's feature on the app-server T3 starts),
            # orchestration-v2/runtimeLayer.ts (the managed Folder's guards, the sign-in guard,
            # Buddy's one conversation and the record of who acted, as decorators where it builds
            # upstream's services), server.ts (the overlay's one route layer, the gate over
            # upstream's server browser, no triage on a managed Environment, the agent scope that
            # gives a thread's agents its agent-browser session, the `t3` command following the
            # version the launcher activated, Buddy's instance without T3's instructions, model or
            # effort where it builds its provider instances, one request namespace for the agent
            # commands' MCP sessions, and no checkpoints in Buddy's project), ws.ts (the managed
            # Folder's config and Buddy's surface for clients, a dispatch run as the session that
            # sent it, and no ChatGPT handoff on a Lazurio Environment), index.html
            # (the shell slot, the name in the app, and the composer's room for Buddy's launcher),
            # main.tsx (the prepared prompt, and the import
            # of the design system's light look, root decision 0200, whose one stylesheet is
            # apps/web/src/lazurio/theme.css), ChatView.tsx (Environment browser, Buddy's surface
            # and its page chip), RightPanelTabs.tsx and rightPanelStore.ts (Environment browser,
            # Nová karta), chat/MessagesTimeline.tsx (Buddy's surface with a line above each day,
            # and the rows that who acted and Buddy's chat leave), chat/TimelineUserMessageRow.tsx
            # (no "Copy prompt link" on a managed Environment, and who sent an agent's folded
            # message), sidebar/SidebarChrome.tsx (the shell's column head under every sidebar's
            # top row, and the name in the app).
            apps/server/src/auth/EnvironmentAuth.ts
            apps/server/src/auth/SessionStore.ts
            apps/server/src/cli/config.ts
            apps/server/src/config.ts
            apps/server/src/environment/ServerEnvironment.ts
            apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.test.ts
            apps/server/src/orchestration-v2/Adapters/CodexAdapterV2.ts
            apps/server/src/orchestration-v2/runtimeLayer.ts
            apps/server/src/server.ts
            apps/server/src/ws.ts
            apps/web/index.html
            apps/web/src/components/ChatView.tsx
            apps/web/src/components/RightPanelTabs.tsx
            apps/web/src/components/chat/MessagesTimeline.tsx
            apps/web/src/components/chat/TimelineUserMessageRow.tsx
            apps/web/src/components/sidebar/SidebarChrome.tsx
            apps/web/src/main.tsx
            apps/web/src/rightPanelStore.ts
            # Hosted configuration: T3CODE_CLIENT_SESSION_TTL, T3CODE_EXTERNAL_ORIGIN (a
            # Secure __Host- cookie, and a loopback bind behind that origin counts as reached
            # remotely; upstream itself accepts cookie-authenticated requests only from allowed
            # origins) and T3CODE_ENVIRONMENT_LABEL. Unset, the server behaves as upstream.
            apps/server/src/auth/EnvironmentAuthPolicy.test.ts
            apps/server/src/auth/EnvironmentAuthPolicy.ts
            apps/server/src/auth/SessionStore.test.ts
            apps/server/src/auth/http.ts
            apps/server/src/auth/utils.ts
            apps/server/src/cli/config.test.ts
            apps/server/src/environment/ServerEnvironmentLabel.ts
            # In-app update from the configured release channel; proposed upstream.
            # T3CODE_RELEASE_REPOSITORY in the server, the launcher and the install scripts, a
            # semver release index, and the optional availableServerUpdate descriptor field behind
            # the web client's update notice. Once the launcher activates the new version, the
            # user's `t3` follows it (Lazurio/t3code#30, server.ts above). Without the variable, the
            # distribution's own releases (Lazurio/t3code) are the default (Lazurio/t3code#22); the
            # desktop app's SSH runner shares it through cliReleaseDownloadBaseUrl. Upstream's test
            # of `t3 update`'s release lookup expects that repository and the index's own paging
            # (Lazurio/t3code#97), and upstream's installer test (install.test.ts) names upstream's
            # repository, which its fixture serves. The composer's Retry and a saved Environment's
            # row offer the advertised target (useSystemComposerBanners.tsx and
            # SavedEnvironmentRows.tsx, which v0.1.2 split out of ChatView.tsx and
            # ConnectionsSettings.tsx). Since v0.1.3 removed the composer's "update available"
            # notice (#25401), the sidebar's update button offers an advertised release:
            # updateEverything.logic.ts makes it that server's target, and since v0.1.6 no update
            # waits on npm (#27847). Since v0.1.4's one row per machine (#26210), a server whose
            # target is not the header's shows its own in UpdateEverythingDialog.tsx, and only a
            # server with threadRestartContinuation is promised that its threads resume
            # (updateEverything.logic.test.ts covers both).
            # ServerEnvironment.test.ts proves that a server the boot service does not manage never
            # asks for a release.
            apps/server/src/cli/update.test.ts
            apps/server/src/cli/update.ts
            apps/server/src/cloud/bootService.ts
            apps/server/src/cloud/pinnedRuntime.test.ts
            apps/server/src/cloud/pinnedRuntime.ts
            apps/server/src/cloud/releaseIndex.test.ts
            apps/server/src/cloud/releaseIndex.ts
            apps/server/src/cloud/selfUpdate.test.ts
            apps/server/src/cloud/selfUpdate.ts
            apps/server/src/environment/ServerEnvironment.test.ts
            apps/web/src/components/chat/useAutoBalanceUpdateBanner.tsx
            apps/web/src/components/chat/useSystemComposerBanners.tsx
            apps/web/src/components/settings/ConnectionsSettings.tsx
            apps/web/src/components/settings/SavedEnvironmentRows.tsx
            apps/web/src/components/sidebar/UpdateEverythingDialog.tsx
            apps/web/src/components/sidebar/updateEverything.logic.test.ts
            apps/web/src/components/sidebar/updateEverything.logic.ts
            apps/web/src/versionSkew.test.ts
            apps/web/src/versionSkew.ts
            packages/contracts/src/environment.ts
            packages/shared/src/cliRelease.test.ts
            packages/shared/src/cliRelease.ts
            scripts/install-scripts.test.ts
            scripts/install.ps1
            scripts/install.sh
            scripts/install.test.ts
            # The Lazurio distribution: its contract test. Its other files sit outside
            # these folders (Dockerfile.lazurio, the lazurio-* workflows, the runbook and
            # the rebuild's skill).
            scripts/lazurio-release-contract.test.mjs
            # Prepared prompt from the Lazurio shell by link (Lazurio/t3code#35): the link is
            # taken off the address at boot (main.tsx, above), kept for the tab without the
            # text across upstream's reload after pairing, and the chat layout opens it as an
            # unsent draft.
            apps/web/src/routes/_chat.tsx
            # The name in the app (root decision 0200): T3 Code (Lazurio), from the stage
            # label of the distribution's builds (Lazurio where upstream says Beta), with the
            # label beside the wordmark in the sidebar, the page title in index.html and the
            # web manifest; a preview is a canary, not a nightly. The wordmark and the icons
            # stay upstream's. v0.1.3's "failed to start" screen (lib/bootError.ts) takes the
            # name from branding.ts too, so upstream's bundled-dev test (bundledDev.test.ts)
            # copies the branding files into its temporary Vite root with bootError.ts.
            apps/web/public/manifest.webmanifest
            apps/web/src/branding.logic.ts
            apps/web/src/branding.ts
            apps/web/src/bundledDev.test.ts
            apps/web/src/lib/bootError.ts
            # The Environment browser (root decision 0191, plan DEV-6646, LazurioPlatform F47):
            # a thread's agents get its agent-browser session, Codex's through the thread's
            # config (CodexAdapterV2.ts, above, whose test expects it) and the others' through the
            # agent scope (server.ts, above), and so do a thread's terminals, through the
            # environment the terminal manager starts their shells with (terminal/Manager.ts,
            # Lazurio/t3code#73). On a Lazurio Environment upstream's server browser
            # is neither built nor advertised (server.ts and ServerEnvironment.ts, above), and
            # T3's browser tools drive the Environment browser as upstream's preferred preview
            # host with upstream's page engine, unchanged, which measures a window Playwright
            # does not emulate when asked for renderScale "display" (#19913);
            # preview_open's result carries a view and a message, and its description says that a
            # person without the inline preview opens the view (Lazurio/t3code#88). One overlay
            # layer (server.ts, above) keeps a thread's tabs in its holder file and streams them
            # to the web, whose right panel shows them. The web's seams are the shared files above,
            # and chat/ThreadServersPanel.tsx, where a plain click on a thread's server opens it in
            # a new tab of the Environment browser instead of upstream's preview (#22542).
            apps/server/src/mcp/toolkits/preview/tools.ts
            apps/server/src/terminal/Manager.ts
            apps/web/src/components/chat/ThreadServersPanel.tsx
            # The managed Lazurio Folder (LazurioPlatform F51): with T3CODE_LAZURIO_FOLDER, Chat
            # starts in the Environment's Folder. Its code lives in apps/*/src/lazurio/; these are
            # the hooks. The server adopts or creates the Folder's project at startup; decorators
            # where runtimeLayer.ts (above) builds the project service, the orchestrator, the
            # session manager and the Scratch folders keep projects, commands and agent turns
            # there; the VCS service keeps repositories out of the Folder; the settings writer
            # applies the Platform's recommended model as the Lazurio project's own model where
            # the person chose none for that project; `t3 lazurio` (binCli.ts) reports both, and
            # clients learn the Folder (ws.ts, above). The web starts new threads there, leaves out
            # what leads elsewhere, including T3's "Copy prompt link" on sent and automation
            # messages (TimelineUserMessageRow.tsx, above) and in the palette, whose links open no
            # thread there (Lazurio/t3code#77), and shows the managed welcome. Upstream's project
            # service tests run through the decorated layer; lazurio/managedFolderVcs.test.ts
            # covers the VCS service's hook.
            apps/server/src/binCli.ts
            apps/server/src/serverRuntimeStartup.ts
            apps/server/src/serverSettings.ts
            apps/server/src/vcs/VcsProvisioningService.ts
            apps/web/src/components/CommandPalette.tsx
            apps/web/src/components/GitActionsControl.tsx
            apps/web/src/components/Sidebar.tsx
            apps/web/src/components/chat/DraftHeroHeadline.tsx
            apps/web/src/components/onboarding/FirstRunGate.tsx
            apps/web/src/components/sidebar/SidebarThreadHeader.tsx
            apps/web/src/hooks/useHandleNewThread.test.ts
            apps/web/src/hooks/useHandleNewThread.ts
            apps/web/src/routes/welcome.tsx
            packages/contracts/src/server.ts
            # Sign-in through Lazurio (root decision 0201, Lazurio/t3code#46): on a Lazurio
            # Environment Codex and Claude sign in through their CLIs from the Launchpad's
            # Getting started page. The web offers that page where it offered T3's own
            # "Continue with ChatGPT"; the server refuses T3's own Codex sign-in (runtimeLayer.ts,
            # above) and upstream's ChatGPT handoff (ws.ts, above; Lazurio/t3code#145), which the
            # web no longer starts through a Lazurio primary, and `t3 lazurio providers` turns
            # providers on and reads them again. Its code lives in apps/*/src/lazurio/; these are
            # the web's hooks.
            apps/web/src/components/settings/AddProviderInstanceDialog.tsx
            apps/web/src/components/settings/CodexSetupSection.tsx
            # The Environment pairs its own browser (the Admin's decision of 2026-10-17, which
            # replaces the rule of 2026-09-21 that a direct visit shows T3's pairing page): without
            # a link's or the desktop app's credential the web's auth gate asks its own origin for
            # one, which the Launchpad mints with `t3 lazurio pairing` behind the gateway, and a
            # session paired on 0.0.45 pairs again. Its code lives in apps/web/src/lazurio/; the
            # gate holds two calls.
            apps/web/src/environments/primary/auth.ts
            # A headless MCP client's runtime-mode ceiling (root decision 0210, addendum 3; proposed
            # upstream): `t3 auth session issue --subject mcp-client --runtime-mode-ceiling <mode>`
            # issues the ceiling the MCP sign-in's approval grants, so an agent without a browser
            # can change threads that run above Supervised (EnvironmentAuth.ts, above). Without the
            # flag nothing changes.
            apps/server/src/cli/auth.test.ts
            apps/server/src/cli/auth.ts
            apps/server/src/cliAuthFormat.ts
            # Agents work with threads as the Environment's owner (root decision 0210, addendum 3;
            # plan DEV-6676): `t3 thread`, `t3 request`, `t3 queue` and `t3 events`. Their code lives
            # in apps/server/src/lazurio/ and binCli.ts (above) adds the commands, with upstream's
            # own `t3 thread` (#22732) merged into one group; `send --wait` prints the reply
            # through upstream's runResultText, which cli/thread.ts exports for it. A thread in
            # `t3 events` is the item `t3_thread_list` returns, which OrchestratorMcpService.ts
            # exports for it.
            apps/server/src/cli/thread.ts
            apps/server/src/mcp/OrchestratorMcpService.ts
            # Agents ask people through the question tool (root decision 0211, plan DEV-6676): the
            # app-server T3 starts gets Codex's feature for request_user_input in Default mode on its
            # command line (CodexAdapterV2.ts, above), and every turn's context tells the agent to ask
            # with it; the Default mode's text no longer asks for a plain-text question. Its code
            # and its tests live in apps/server/src/lazurio/questionTool*.ts.
            apps/server/src/provider/CodexDeveloperInstructions.ts
            # Buddy's Hermes gets only the person's words (root decision 0210, plan DEV-6676): in
            # Buddy's own T3 Code (T3CODE_LAZURIO_BUDDY=1) the ACP instance `buddy` runs Hermes,
            # which keeps every prompt in Buddy's memory. The ACP adapter leaves T3's instructions
            # out of an instance's prompts where its host says so (AcpT3Instructions; server.ts,
            # above, says so for Buddy's instance), and the turn start projects a page context as a
            # labelled Czech block for that instance. Since 0210's addendum of HumanAndMachines/Lazurio#648 the Platform
            # sets Buddy's model and effort in Hermes's own config: the adapter applies no model
            # and only the options a host names where it says so (AcpT3Selection, Hermes's speed
            # for Buddy's instance), and the adapter's test checks that on the mock agent
            # (AcpAdapterV2.test.ts). Its code lives in apps/server/src/lazurio/buddyPrompt.ts.
            apps/server/src/orchestration-v2/Adapters/AcpAdapterV2.test.ts
            apps/server/src/orchestration-v2/ProviderTurnStartService.ts
            packages/provider-acp/src/server/adapter.ts
            # Buddy's one conversation (root decision 0210, plan DEV-6676): Buddy's T3 Code is one
            # thread in Buddy's layer of the Lazurio Folder, its managed Folder. The server refuses
            # forks, rollbacks and any other thread (runtimeLayer.ts, above), takes no checkpoints
            # in Buddy's project and keeps linked Environments off (server.ts, above, and the
            # settings `t3 environment` builds for itself, cli/environment.ts), applies Buddy's
            # defaults once at startup (serverRuntimeStartup.ts, above) and tells clients (ws.ts and
            # the contracts' server.ts, above). The web shows Buddy's surface in place of T3's
            # sidebar and command palette (__root.tsx) and opens Buddy's thread at `/`
            # (_chat.index.tsx); the chat route's shortcuts, which v0.1.3 installs at app start
            # (#25366), are off there (shortcuts/chatRouteCommands.ts), and so is upstream's guest
            # sharing of a thread (#24104, __root.tsx and runtimeLayer.ts, above), since a
            # Personalspace is never shared (root decision 0091); the chat layout leaves out the
            # prepared prompt (_chat.tsx, above), the chat its header, thread details and rollbacks
            # (ChatView.tsx, above), and the timeline draws a line above each day
            # (MessagesTimeline.tsx, above) and no fork button: the row state knows Buddy's surface
            # (timelineRowContext.ts) and the assistant row's meta leaves the fork out
            # (TimelineAssistantRows.tsx). avatar.webp is Buddy's character from the design system.
            # Its code lives in apps/*/src/lazurio/ (buddySurface* and BuddySurface.tsx).
            apps/server/src/cli/environment.ts
            apps/web/public/assets/avatar.webp
            apps/web/src/components/chat/TimelineAssistantRows.tsx
            apps/web/src/components/chat/timelineRowContext.ts
            apps/web/src/routes/__root.tsx
            apps/web/src/routes/_chat.index.tsx
            apps/web/src/shortcuts/chatRouteCommands.ts
            # The page Buddy is asked from (root decision 0210, plan DEV-6676): in Buddy's surface
            # the host page's last valid context is a chip above the composer, which the person can
            # remove. While it is there, a message carries the page as a `lazurio-page` record
            # with a reference in its text (useComposerSend.ts, from the record ChatView.tsx, above,
            # passes it), which Buddy's T3 Code projects as the Czech block (row 23). Composer and
            # sent messages show the reference as a page chip where T3 would call an unknown context
            # unavailable (composerContextPresentation.tsx and UserMessageContextChips.tsx). Its
            # code lives in apps/web/src/lazurio/ (buddySurfacePage.ts, BuddySurfacePageChip.tsx).
            # useComposerSend.ts also counts a sent prompt toward upstream's request for a star on
            # its repository (#27832) only outside a Lazurio Environment (lazurio/starPrompt.ts).
            apps/web/src/components/chat/UserMessageContextChips.tsx
            apps/web/src/components/chat/useComposerSend.ts
            apps/web/src/components/composerContextPresentation.tsx
            # Who acted: Buddy and Delegace (root decision 0210, evening addendum, point 5; plan
            # DEV-6676). An agent command whose environment names who it acts as
            # (T3CODE_ACTING_SENDER) issues its sessions with that claim signed in (SessionStore.ts
            # and EnvironmentAuth.ts, above). An MCP client's invocation carries it to the tools,
            # the client surface runs a dispatch as its session (ws.ts, above), the orchestrator's
            # decorator records the messages and decisions it sent (runtimeLayer.ts, above), and the
            # web marks them: the timeline's rows leave out Delegace's wake (MessagesTimeline.tsx,
            # above), an agent's folded message names Buddy (TimelineUserMessageRow.tsx, above) and
            # a request Buddy decided carries the mark (TimelineWorkEntryRow.tsx). Its code lives in
            # apps/*/src/lazurio/.
            apps/server/src/auth/McpOAuth.ts
            apps/server/src/mcp/McpInvocationContext.ts
            apps/web/src/components/chat/TimelineWorkEntryRow.tsx
            # Buddy's chat reads like a chat with a friend (root decision 0210, addendum of
            # 2026-10-22, point 1; plan DEV-6676; row 28): Buddy's surface shows what Buddy writes
            # and one quiet line while he works, also on work that still runs after his turn,
            # never T3's work rows, and a failed turn as one line in human words
            # (MessagesTimeline.tsx, above). The thread's error banner speaks in human words too
            # (ChatBannerLane.tsx), and the end of the timeline shows none of the turn's work: no
            # background work, goal or child thread's question, and the queue there counts only the
            # person's messages (ChatView.tsx, above; v0.1.3 moved them there, #25401). The
            # composer asks for a message to Buddy (ChatComposer.tsx). Since 0210's addendum of
            # HumanAndMachines/Lazurio#648 its only control is Hermes's Normal / Fast switch, in place of T3's model,
            # options, access and mode (ComposerControlsBar.tsx), and the runtime mode it asks for
            # is always full access (ChatView.tsx, above). Its queue holds only the person's own
            # messages (QueuedRunsControl.tsx). The keys of the terminal, the right panel and the
            # choices it does not offer stay the browser's (ChatView.tsx and __root.tsx, above;
            # Lazurio/t3code#109). It shows neither T3's terminal nor its right panel, whatever the
            # thread holds, and follows no Environment browser tabs (ChatView.tsx, above); a code
            # block offers no Run in terminal (MessagesTimeline.tsx, above), and a link in the
            # conversation opens in a new tab. Its code lives in apps/web/src/lazurio/
            # (buddySurfaceTimeline.ts, buddySurfaceControls.ts, BuddySurface.tsx).
            apps/web/src/components/chat/ChatBannerLane.tsx
            apps/web/src/components/chat/ChatComposer.tsx
            apps/web/src/components/chat/ComposerControlsBar.tsx
            apps/web/src/components/chat/QueuedRunsControl.tsx
            # Any steer queues while the running turn waits on the person's answer to a question or
            # an approval, instead of aborting the provider's pending callback (row 30,
            # Lazurio/t3code#119, Lazurio/t3code#139): the guard in CommandPolicy.ts, a promoted
            # message first in the queue (Orchestrator.ts), and their tests.
            apps/server/src/orchestration-v2/CommandPolicy.test.ts
            apps/server/src/orchestration-v2/CommandPolicy.ts
            apps/server/src/orchestration-v2/Orchestrator.ts
            apps/server/src/orchestration-v2/SteeringCompletion.integration.test.ts
            apps/server/src/orchestration-v2/ThreadManagementService.test.ts
            # A follow-up `queue` saved before the v0.1.3 line becomes `steer` once, and the marker
            # the web client's settings store next to them keeps a later `queue` (Lazurio/t3code#140;
            # the migration is apps/web/src/lazurio/followUpSteerMigration.ts).
            apps/web/src/clientPersistenceStorage.ts
            apps/web/src/clientPersistenceStorage.test.ts
            # A commit, push or pull request runs detached from the socket that started it and
            # finishes when that socket closes; the client reports a dropped connection as lost,
            # not as a failed action (row 31, Lazurio/t3code#125). ws.ts is listed above.
            apps/server/src/git/detachedProgressStream.ts
            apps/server/src/git/detachedProgressStream.test.ts
            packages/client-runtime/src/state/vcsAction.ts
            packages/client-runtime/src/state/vcsAction.test.ts
            # A message sent while an ACP agent works steers its running turn through the extension
            # request _lazurio/steer instead of cancelling it, where the agent lists
            # lazurio.activeSteer in initialize's _meta (row 33, Lazurio/t3code#138): the adapter and
            # its test are listed above, effect-acp keeps capabilities._meta, and the mock agent
            # answers the request. Such an agent confirms steers (ProviderAdapter.ts): the turn
            # control service asks it about a turn that completed while the steer was on its way,
            # and only its refusal sends the message as the next turn (Lazurio/t3code#141).
            apps/server/scripts/acp-mock-agent.ts
            packages/effect-acp/src/client.ts
            packages/provider-core/src/server/ProviderAdapter.ts
            apps/server/src/orchestration-v2/ProviderTurnControlService.ts
          )
          unexpected="$(git diff --name-only "$UPSTREAM_SHA..HEAD" |
            grep -E '^(apps|packages|scripts)/' |
            grep -vE '^apps/[^/]+/src/lazurio/' |
            grep -vxF -f <(printf '%s\n' "${allowed_upstream_changes[@]}") || true)"
          if [ -n "$unexpected" ]; then
            echo "Fork overlay changed an upstream file that is not on its allowlist:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.14.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec vp fmt --check

      # Upstream's lint script with upstream's rules (the same rules its own `vp check`
      # holds).
      - name: Lint
        run: pnpm run lint

      - name: Typecheck server and web
        run: |
          pnpm exec vp run --filter t3 typecheck
          pnpm exec vp run --filter @t3tools/web typecheck

      # Upstream's web tests that render React run in headless Chromium (#20797), and so
      # does the engine test of upstream's server browser in the gate below. Upstream's
      # own test jobs install the same shell this way; web and server pin the same
      # Playwright, so one install serves both.
      - name: Install Chromium for the browser tests
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium

      # The tests come from the diff against the exact upstream base, so a new
      # seam is tested without editing this step: every test file the overlay
      # adds or changes, and upstream's own tests beside every file it changes
      # (X.ts → X.test.ts, X.browser.test.ts and any other X.<name>.test.ts). Plus
      # the fixed gate below, whatever the diff says. Each package runs its files
      # with its own test script.
      - name: Test what the overlay changes
        run: |
          set -euo pipefail
          # The fixed gate: every test under these paths runs. It keeps what fork CI
          # always ran: the directories whose tests import overlay seams without
          # being changed (src/auth: the external origin, the session TTL and the
          # server config), both overlay folders (which also hold the tests of the
          # environment label, the managed Folder's VCS hook and the right panel's
          # "+" and Mod+T, whose upstream test files v0.1.2 deleted), the tests of
          # the hosted configuration and the managed Folder (ProjectService.test.ts
          # runs upstream's project tests through the decorated project service), the
          # engine test of upstream's server browser, which the Environment browser's
          # host drives, and the check that the React Compiler compiles every web
          # file, the overlay's included. A path that is gone or holds no tests fails
          # the step, so a rebuild reviews the gate.
          gate=(
            apps/server/src/auth
            apps/server/src/cli/config.test.ts
            apps/server/src/lazurio
            apps/server/src/preview/ServerBrowserPage.test.ts
            apps/server/src/project/ProjectService.test.ts
            apps/server/src/serverSettings.test.ts
            apps/web/src/lazurio
            apps/web/src/reactCompilerCoverage.test.ts
          )
          tests="$RUNNER_TEMP/overlay-tests.tsv"
          {
            git diff --name-only --diff-filter=d "$UPSTREAM_SHA..HEAD" -- '*.ts' '*.tsx' |
              while IFS= read -r file; do
                case "$file" in
                  *.test.ts | *.test.tsx) echo "$file" ;;
                  *)
                    for test in "${file%.*}".test.ts "${file%.*}".test.tsx "${file%.*}".*.test.ts "${file%.*}".*.test.tsx; do
                      if [ -f "$test" ]; then echo "$test"; fi
                    done
                    ;;
                esac
              done
            for path in "${gate[@]}"; do
              gated="$(git ls-files -- "$path" | grep -E '\.test\.tsx?$' || true)"
              if [ -z "$gated" ]; then
                echo "The test gate's $path is gone or holds no tests." >&2
                exit 1
              fi
              echo "$gated"
            done
          } | sort -u |
            while IFS= read -r test; do
              package="$(dirname "$test")"
              until [ -f "$package/package.json" ]; do package="$(dirname "$package")"; done
              printf '%s\t%s\n' "$package" "${test#"$package"/}"
            done > "$tests"
          status=0
          for package in $(cut -f1 "$tests" | sort -u); do
            files=()
            while IFS=$'\t' read -r owner test; do
              if [ "$owner" = "$package" ]; then files+=("$test"); fi
            done < "$tests"
            echo "::group::$package: ${#files[@]} test files"
            (cd "$package" && pnpm run test "${files[@]}") || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Validate Lazurio release contract
        run: node --test scripts/lazurio-release-contract.test.mjs

      - name: Build the release image without publishing
        run: |
          set -euo pipefail
          docker build \
            --file Dockerfile.lazurio \
            --build-arg NODE_BASE_IMAGE=node:26.12.1-bookworm@sha256:5c4012d11d9857c42713ba511fbc19645cac1706bb710d51d42b0d301dff7f88 \
            --build-arg PACKAGE_VERSION="${UPSTREAM_TAG#v}-lazurio.0" \
            --build-arg PNPM_VERSION=12.14.0 \
            --build-arg RELEASE_TAG=ci \
            --build-arg SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            --build-arg SOURCE_REVISION="$(git rev-parse HEAD)" \
            --build-arg UPSTREAM_BASE="$UPSTREAM_SHA" \
            --tag lazurio/t3code:ci \
            .
          docker run --rm --network none lazurio/t3code:ci --version | grep -Fx "t3 ${UPSTREAM_TAG}-lazurio.0"
          docker image inspect lazurio/t3code:ci \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | \
            grep -Fx 'T3CODE_CLIENT_SESSION_TTL=365d'
          docker run --rm --network none --entrypoint cat lazurio/t3code:ci \
            /opt/lazurio-t3/LICENSE | cmp - LICENSE
          docker run --rm --network none --entrypoint cat lazurio/t3code:ci \
            /opt/lazurio-t3/dist/client/favicon.ico | cmp - assets/prod/t3-black-web-favicon.ico

  # The same archive build and launcher install the release runs, under the
  # never-released version <upstream>-lazurio.0. Keep it in step with UPSTREAM_TAG.
  cli-archives:
    name: CLI archives
    uses: ./.github/workflows/lazurio-cli-archives.yml
    with:
      version: 0.1.6-lazurio.0
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      source_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
